<!doctype html>
<html lang="en" data-theme="dark">
<head><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../../components/bundle.css"><script src="../../components/bundle.js"></script><meta charset="utf-8"><title>Checklist</title>
<style>html,body{margin:0}body{background:var(--bg)}</style></head>
<body>
<div class="db" style="padding:16px;background:var(--bg);"><div style="width:388px;background:var(--surface-raised);border:1px solid var(--border);border-radius:var(--radius-lg);padding:12px 16px"><div class="checklist">
  <div class="checklist__head drawer__label">Checklist<span class="num" style="font-weight:400">4 of 6</span><span class="progress" role="progressbar" aria-valuenow="4" aria-valuemin="0" aria-valuemax="6"><span class="progress__fill fill--physics" style="width:67%"></span></span></div>
  <ul><li class="checklist__item is-done"><span class="check" role="checkbox" tabindex="0" aria-checked="true" aria-label="Untick step" title="Untick step"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg></span><span class="checklist__text grow">Take the 10-swing timings for five lengths</span></li><li class="checklist__item is-done"><span class="check" role="checkbox" tabindex="0" aria-checked="true" aria-label="Untick step" title="Untick step"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg></span><span class="checklist__text grow">Results table with units</span></li><li class="checklist__item is-done"><span class="check" role="checkbox" tabindex="0" aria-checked="true" aria-label="Untick step" title="Untick step"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg></span><span class="checklist__text grow">Calculate T and T²</span></li><li class="checklist__item is-done"><span class="check" role="checkbox" tabindex="0" aria-checked="true" aria-label="Untick step" title="Untick step"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg></span><span class="checklist__text grow">Plot T² against L with error bars</span></li><li class="checklist__item"><span class="check" role="checkbox" tabindex="0" aria-checked="false" aria-label="Tick step" title="Tick step"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg></span><span class="checklist__text grow">Work out g from the gradient, with its uncertainty</span></li><li class="checklist__item"><span class="check" role="checkbox" tabindex="0" aria-checked="false" aria-label="Tick step" title="Tick step"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg></span><span class="checklist__text grow">Write the evaluation and conclusion</span></li></ul>
  <div class="checklist__add"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg><span>Add a step</span></div>
</div></div></div>
</body>
</html>
